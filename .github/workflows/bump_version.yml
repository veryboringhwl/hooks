name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version component to bump"
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]
      spotify_min:
        description: "Minimum Spotify version for this hooks release (e.g. 1.2.92)"
        required: true
      spotify_max:
        description: "Maximum Spotify version (e.g. 1.2.95, or 'latest' for open-ended)"
        required: true

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version
        id: version
        run: |
          CURRENT=$(grep -oP 'export const HOOKS_VERSION = "\K[^"]+' static.ts)
          IFS='.' read -r major minor patch <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          NEW_VERSION="$major.$minor.$patch"
          sed -i "s/export const HOOKS_VERSION = \"[^\"]*\"/export const HOOKS_VERSION = \"$NEW_VERSION\"/" static.ts
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - uses: IAreKyleW00t/verified-bot-commit@v2.3.4
        with:
          message: "chore: bump to v${{ steps.version.outputs.version }}"
          ref: refs/heads/main
          files: "**"
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: ref } = await github.rest.git.getRef({
              ...context.repo, ref: 'heads/main'
            });
            await github.rest.git.createRef({
              ...context.repo, ref: `refs/tags/v${process.env.VERSION}`, sha: ref.object.sha
            });
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'release.yml', ref: 'main',
              inputs: {
                tag: process.env.VERSION,
                spotify_min: '${{ inputs.spotify_min }}',
                spotify_max: '${{ inputs.spotify_max }}'
              }
            });
